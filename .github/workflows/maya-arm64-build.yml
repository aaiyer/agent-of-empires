name: Emergency ARM64 Build

on:
  push:
    branches:
      - maya-restricted-v1.13.2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build aoe-linux-arm64
    runs-on: ubuntu-24.04-arm
    container: quay.io/pypa/manylinux_2_28_aarch64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install container build dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            git curl tar gzip xz \
            perl-IPC-Cmd perl-Time-Piece perl-Digest-SHA
          curl -fsSL https://rpm.nodesource.com/setup_22.x | bash -
          dnf install -y nodejs

      - name: Build web frontend
        run: cd web && npm install && npm run build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Build
        run: cargo build --release --features serve --target aarch64-unknown-linux-gnu

      - name: Package
        run: |
          mkdir -p dist
          cp target/aarch64-unknown-linux-gnu/release/aoe dist/aoe-linux-arm64
          cd dist
          tar -czvf aoe-linux-arm64.tar.gz aoe-linux-arm64
          shasum -a 256 aoe-linux-arm64.tar.gz > aoe-linux-arm64.tar.gz.sha256
          cat aoe-linux-arm64.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aoe-linux-arm64
          path: |
            dist/aoe-linux-arm64.tar.gz
            dist/aoe-linux-arm64.tar.gz.sha256
